[build-system]
requires = ["scikit-build-core>=0.12.0"]
build-backend = "scikit_build_core.build"

[project]
name = "libgguf"
version = "0.2.0"
description = "Standalone GGUF reference quantization bindings"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
gpu = ["torch"]
test = ["gguf", "huggingface_hub", "pytest", "requests", "safetensors", "torch", "tqdm"]

[project.scripts]
gguf-inspect = "libgguf.inspect:main"
gguf-validate = "libgguf.inspect:validate_main"
gguf-compare = "libgguf.compare:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.scikit-build]
minimum-version = "0.12"
cmake.version = ">=3.21"
cmake.build-type = "Release"
wheel.packages = ["src/libgguf"]
wheel.exclude = ["libgguf/libgguf_*/tests/**"]

[[tool.scikit-build.overrides]]
if.platform-system = "win32"
if.failed = true
cmake.args = ["-G", "Ninja"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "pp* *-musllinux* cp31t-*"
build-verbosity = 1
environment = { LIBGGUF_BUILD_GPU = "OFF", LIBGGUF_ENABLE_ROCM = "OFF", LIBGGUF_ENABLE_CUDA = "OFF", LIBGGUF_BUILD_TORCH = "OFF", LIBGGUF_CPU_BACKEND = "REF" }
